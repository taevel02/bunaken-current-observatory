name: Trusted environmental pipeline
on:
  schedule:
    - cron: "17 23,11 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [collect, seal]
        default: collect
      date_wita:
        description: WITA target date (YYYY-MM-DD; collect defaults to tomorrow)
        required: false
        type: string
      code_commit:
        description: Trusted full code commit SHA
        required: true
        type: string
  workflow_call:
    inputs:
      operation:
        type: string
        default: collect
      date_wita:
        type: string
        default: ""
      code_commit:
        type: string
        required: true
    secrets:
      GITHUB_WRITE_TOKEN:
        required: false
      COPERNICUSMARINE_SERVICE_USERNAME:
        required: false
      COPERNICUSMARINE_SERVICE_PASSWORD:
        required: false
      OPEN_METEO_API_KEY:
        required: false
      AVISO_USERNAME:
        required: false
      AVISO_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    environment: environmental-data
    concurrency:
      group: bunaken-environment-${{ github.event.schedule == '17 12 * * *' && 'seal' || inputs.operation || 'collect' }}
      cancel-in-progress: false
    env:
      CODE_COMMIT: ${{ inputs.code_commit || github.sha }}
      TARGET_DATE: ${{ inputs.date_wita }}
      OPERATION: ${{ github.event.schedule == '17 12 * * *' && 'seal' || inputs.operation || 'collect' }}
    timeout-minutes: 180
    steps:
      - name: Validate trusted invocation
        env:
          EVENT: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          [[ "$CODE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || ( -z "$TARGET_DATE" && ( "$OPERATION" == collect || "$EVENT" == schedule ) ) ]] || exit 1
          [[ "$OPERATION" == collect || "$OPERATION" == seal ]] || exit 1
          [[ "$EVENT" == workflow_dispatch || "$EVENT" == push || "$EVENT" == schedule ]] || exit 1
          [[ "$EVENT_REF" == refs/heads/main || ( "$EVENT" == push && "$EVENT_REF" == refs/heads/data ) ]] || exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CODE_COMMIT }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require code from main history
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.19
      - run: uv sync --project engine --extra providers --locked
      - name: Verify trusted engine
        run: |
          uv run --project engine --locked python -m unittest discover -s engine/tests
          uv run --project engine --extra providers --locked python -m unittest discover -s engine/provider-tests
      - name: Prepare private FES atlas
        if: env.OPERATION == 'collect'
        env:
          AVISO_USERNAME: ${{ secrets.AVISO_USERNAME }}
          AVISO_PASSWORD: ${{ secrets.AVISO_PASSWORD }}
        run: |
          if [[ -z "$AVISO_USERNAME" || -z "$AVISO_PASSWORD" ]]; then
            echo "Private FES credentials unavailable; collection remains fail closed"
            exit 1
          fi
          uv run --project engine --extra providers --locked python -m bunaken_engine.fes_atlas --output .local/fes2022b --workers 3 --discard-originals
          echo "FES_CONFIG_PATH=$GITHUB_WORKSPACE/.local/fes2022b/fes2022.yaml" >> "$GITHUB_ENV"
          echo "FES_ATLAS_UNIT=cm" >> "$GITHUB_ENV"
      - name: Verify FES against independent reference
        if: env.OPERATION == 'collect'
        env:
          LIBFES_COMMIT: b1d65f7782c32fab57e9ac3d14ca20b883b67331
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cmake libnetcdf-dev
          git clone --no-checkout https://github.com/CNES/aviso-fes.git "$RUNNER_TEMP/libfes-source"
          git -C "$RUNNER_TEMP/libfes-source" checkout --detach "$LIBFES_COMMIT"
          [[ "$(git -C "$RUNNER_TEMP/libfes-source" rev-parse HEAD)" == "$LIBFES_COMMIT" ]]
          git -C "$RUNNER_TEMP/libfes-source" submodule update --init --depth 1
          cmake -S "$RUNNER_TEMP/libfes-source" -B "$RUNNER_TEMP/libfes-build" -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_SHARED_LIBS=ON
          cmake --build "$RUNNER_TEMP/libfes-build" -j 2
          REFERENCE_DAY=$(TZ=Asia/Makassar date -d yesterday +%F)
          uv run --project engine --extra providers --locked python -m bunaken_engine.fes_research --atlas .local/fes2022b --start "${REFERENCE_DAY}T00:00:00+08:00" --days 1 --reference-library "$RUNNER_TEMP/libfes-build/src/libfes.so" --output .local/fes-reference
          echo "FES_VALIDATION_MANIFEST_PATH=$GITHUB_WORKSPACE/.local/fes-reference/manifest.json" >> "$GITHUB_ENV"
      - name: Collect or seal in one chain
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_WRITE_TOKEN: ${{ secrets.GITHUB_WRITE_TOKEN }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          OPEN_METEO_USAGE_MODE: ${{ vars.OPEN_METEO_USAGE_MODE }}
          MODEL_OBSERVER_ID: ${{ vars.MODEL_OBSERVER_ID }}
          MODEL_RUBRIC_VERSION: ${{ vars.MODEL_RUBRIC_VERSION }}
        run: |
          if [[ -z "$TARGET_DATE" ]]; then
            TARGET_DATE=$(TZ=Asia/Makassar date -d tomorrow +%F)
          fi
          export GITHUB_OWNER="${REPOSITORY%/*}"
          export GITHUB_REPO="${REPOSITORY#*/}"
          if [[ "$OPERATION" == collect ]]; then
            SNAPSHOT_RUN_ID=$(uv run --project engine --locked python -c 'import os,uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, "bunaken:"+os.environ["REPOSITORY"]+":"+os.environ["RUN_ID"]))')
            MODEL_ARGS=()
            if [[ -n "$MODEL_OBSERVER_ID" && -n "$MODEL_RUBRIC_VERSION" ]]; then
              MODEL_ARGS=(--model-from-data --observer "$MODEL_OBSERVER_ID" --rubric "$MODEL_RUBRIC_VERSION")
            fi
            uv run --project engine --extra providers --locked python -m bunaken_engine collect --date "$TARGET_DATE" --code-commit "$CODE_COMMIT" --run-id "$SNAPSHOT_RUN_ID" --output "$RUNNER_TEMP/bunaken-output" --publish "${MODEL_ARGS[@]}"
            SOURCE_DATA_COMMIT=$(uv run --project engine --locked python -c 'from bunaken_engine.__main__ import store_from_env; print(store_from_env().head())')
            uv run --project engine --locked python -m bunaken_engine.public_release --source-data-commit "$SOURCE_DATA_COMMIT" --snapshot "$RUNNER_TEMP/bunaken-output/snapshots/$TARGET_DATE/$SNAPSHOT_RUN_ID/manifest.json" --output "$RUNNER_TEMP/bunaken-web" --publish
          else
            uv run --project engine --locked python -m bunaken_engine seal --date "$TARGET_DATE" --publish
          fi
