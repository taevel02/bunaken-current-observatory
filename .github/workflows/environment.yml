name: Trusted environmental pipeline
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [collect, seal]
        default: collect
      date_wita:
        description: WITA target date (YYYY-MM-DD)
        required: true
        type: string
      code_commit:
        description: Trusted full code commit SHA
        required: true
        type: string
  workflow_call:
    inputs:
      operation:
        type: string
        default: collect
      date_wita:
        type: string
        required: true
      code_commit:
        type: string
        required: true
    secrets:
      GITHUB_WRITE_TOKEN:
        required: true
      COPERNICUSMARINE_SERVICE_USERNAME:
        required: false
      COPERNICUSMARINE_SERVICE_PASSWORD:
        required: false
      OPEN_METEO_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    environment: environmental-data
    steps:
      - name: Validate trusted invocation
        env:
          CODE_COMMIT: ${{ inputs.code_commit }}
          TARGET_DATE: ${{ inputs.date_wita }}
          OPERATION: ${{ inputs.operation }}
          EVENT: ${{ github.event_name }}
        run: |
          [[ "$CODE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$OPERATION" == collect || "$OPERATION" == seal ]]
          [[ "$EVENT" == workflow_dispatch || "$EVENT" == push ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.code_commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require code from main history
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.19
      - run: uv sync --project engine --extra providers --locked
      - name: Verify trusted engine
        run: |
          uv run --project engine --locked python -m unittest discover -s engine/tests
          uv run --project engine --extra providers --locked python -m unittest discover -s engine/provider-tests
      - name: Collect or seal in one chain
        env:
          CODE_COMMIT: ${{ inputs.code_commit }}
          TARGET_DATE: ${{ inputs.date_wita }}
          OPERATION: ${{ inputs.operation }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_WRITE_TOKEN: ${{ secrets.GITHUB_WRITE_TOKEN }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          OPEN_METEO_USAGE_MODE: ${{ vars.OPEN_METEO_USAGE_MODE }}
        run: |
          export GITHUB_OWNER="${REPOSITORY%/*}"
          export GITHUB_REPO="${REPOSITORY#*/}"
          if [[ "$OPERATION" == collect ]]; then
            SNAPSHOT_RUN_ID=$(uv run --project engine --locked python -c 'import os,uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, "bunaken:"+os.environ["REPOSITORY"]+":"+os.environ["RUN_ID"]))')
            uv run --project engine --extra providers --locked python -m bunaken_engine collect --date "$TARGET_DATE" --code-commit "$CODE_COMMIT" --run-id "$SNAPSHOT_RUN_ID" --output "$RUNNER_TEMP/bunaken-output" --publish
          else
            uv run --project engine --locked python -m bunaken_engine seal --date "$TARGET_DATE" --publish
          fi
