name: Trusted environmental pipeline
on:
  schedule:
    - cron: "17 23,11 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [collect, seal, match]
        default: collect
      date_wita:
        description: WITA target date (YYYY-MM-DD; collect defaults to tomorrow)
        required: false
        type: string
      code_commit:
        description: Trusted full code commit SHA
        required: false
        default: c121daef307de4feb99d861cf96d5f219e6fc197
        type: string
      resume_run_id:
        description: Existing immutable run UUID to resume without recollection (requires date_wita)
        required: false
        type: string
  workflow_call:
    inputs:
      operation:
        type: string
        default: collect
      date_wita:
        type: string
        default: ""
      code_commit:
        type: string
        required: true
      resume_run_id:
        type: string
        default: ""
    secrets:
      DATA_WRITE_TOKEN:
        required: false
      COPERNICUSMARINE_SERVICE_USERNAME:
        required: false
      COPERNICUSMARINE_SERVICE_PASSWORD:
        required: false
      COPERNICUSMARINE__SERVICE_PASSWORD:
        required: false
      OPEN_METEO_API_KEY:
        required: false
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    environment: environmental-data
    concurrency:
      group: bunaken-environment-${{ github.event.schedule == '17 12 * * *' && 'seal' || inputs.operation || 'collect' }}
      cancel-in-progress: false
    env:
      CODE_COMMIT: ${{ inputs.code_commit || 'c121daef307de4feb99d861cf96d5f219e6fc197' }}
      TARGET_DATE: ${{ inputs.date_wita }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      OPERATION: ${{ github.event.schedule == '17 12 * * *' && 'seal' || inputs.operation || 'collect' }}
      GIT_DATA_CACHE_ROOT: ${{ runner.temp }}/bunaken-git-data-cache
    timeout-minutes: 360
    steps:
      - name: Validate trusted invocation
        env:
          EVENT: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          [[ "$CODE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ -z "$RESUME_RUN_ID" || ( "$OPERATION" == collect && -n "$TARGET_DATE" && "$RESUME_RUN_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ) ]] || exit 1
          [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ || ( -z "$TARGET_DATE" && ( "$OPERATION" == collect || "$EVENT" == schedule || "$OPERATION" == match ) ) ]] || exit 1
          [[ "$OPERATION" == collect || "$OPERATION" == seal || "$OPERATION" == match ]] || exit 1
          [[ "$EVENT" == workflow_dispatch || "$EVENT" == push || "$EVENT" == schedule ]] || exit 1
          [[ "$EVENT_REF" == refs/heads/main || ( "$EVENT" == push && "$EVENT_REF" == refs/heads/data ) ]] || exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.CODE_COMMIT }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require code from main history
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.19
      - run: uv sync --project engine --extra providers --locked
      - name: Verify trusted engine
        run: |
          uv run --project engine --locked python -m unittest discover -s engine/tests
          uv run --project engine --extra providers --locked python -m unittest discover -s engine/provider-tests
      - name: Restore public Git blob cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GIT_DATA_CACHE_ROOT }}/blobs
          key: bunaken-public-blobs-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bunaken-public-blobs-v1-${{ runner.os }}-
      - name: Fetch verified tidal ephemeris
        if: env.OPERATION == 'collect' && env.RESUME_RUN_ID == ''
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_WRITE_TOKEN: ${{ secrets.DATA_WRITE_TOKEN }}
        run: |
          uv run --project engine --locked python -m bunaken_engine.fes_cache fetch --directory "$RUNNER_TEMP/fes-derived"
          echo "FES_DERIVED_ROOT=$RUNNER_TEMP/fes-derived" >> "$GITHUB_ENV"
      - name: Collect or seal in one chain
        timeout-minutes: 300
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GITHUB_WRITE_TOKEN: ${{ secrets.DATA_WRITE_TOKEN }}
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD || secrets.COPERNICUSMARINE__SERVICE_PASSWORD }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          OPEN_METEO_USAGE_MODE: ${{ vars.OPEN_METEO_USAGE_MODE }}
          MODEL_OBSERVER_ID: ${{ vars.MODEL_OBSERVER_ID }}
          MODEL_RUBRIC_VERSION: ${{ vars.MODEL_RUBRIC_VERSION }}
        run: |
          if [[ -z "$TARGET_DATE" && "$OPERATION" != match ]]; then
            if [[ "$OPERATION" == seal ]]; then
              # A delayed run after midnight must seal today, not a future cutoff.
              TARGET_DATE=$(uv run --project engine --locked python -c 'from datetime import datetime,timedelta; from zoneinfo import ZoneInfo; print((datetime.now(ZoneInfo("Asia/Makassar"))+timedelta(hours=4)).date().isoformat())')
            else
              TARGET_DATE=$(TZ=Asia/Makassar date -d tomorrow +%F)
            fi
          fi
          export GITHUB_OWNER="${REPOSITORY%/*}"
          export GITHUB_REPO="${REPOSITORY#*/}"
          if [[ "$OPERATION" == collect ]]; then
            SNAPSHOT_RUN_ID="$RESUME_RUN_ID"
            RESUME_ARGS=()
            if [[ -z "$SNAPSHOT_RUN_ID" ]]; then
              SNAPSHOT_RUN_ID=$(uv run --project engine --locked python -c 'import os,uuid; print(uuid.uuid5(uuid.NAMESPACE_URL, "bunaken:"+os.environ["REPOSITORY"]+":"+os.environ["RUN_ID"]))')
            else
              RESUME_ARGS=(--resume-only)
            fi
            MODEL_ARGS=()
            if [[ -z "$MODEL_OBSERVER_ID" || -z "$MODEL_RUBRIC_VERSION" ]]; then
              echo "::error::MODEL_OBSERVER_ID and MODEL_RUBRIC_VERSION are required"
              exit 1
            fi
            if [[ -n "$MODEL_OBSERVER_ID" && -n "$MODEL_RUBRIC_VERSION" ]]; then
              MODEL_ARGS=(--model-from-data --observer "$MODEL_OBSERVER_ID" --rubric "$MODEL_RUBRIC_VERSION")
            fi
            echo "::group::Collect and verify immutable snapshot"
            uv run --project engine --extra providers --locked python -m bunaken_engine collect --date "$TARGET_DATE" --code-commit "$CODE_COMMIT" --run-id "$SNAPSHOT_RUN_ID" --output "$RUNNER_TEMP/bunaken-output" --publish "${MODEL_ARGS[@]}" "${RESUME_ARGS[@]}"
            echo "::endgroup::"
            echo "TARGET_DATE=$TARGET_DATE" >> "$GITHUB_ENV"
            echo "SNAPSHOT_RUN_ID=$SNAPSHOT_RUN_ID" >> "$GITHUB_ENV"
          elif [[ "$OPERATION" == seal ]]; then
            uv run --project engine --locked python -m bunaken_engine seal --date "$TARGET_DATE" --publish
          fi
      - name: Publish validated web release
        if: env.OPERATION == 'collect'
        timeout-minutes: 45
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_WRITE_TOKEN: ${{ secrets.DATA_WRITE_TOKEN }}
        run: |
            SOURCE_DATA_COMMIT=$(uv run --project engine --locked python -c 'from bunaken_engine.__main__ import store_from_env; print(store_from_env().head())')
            MANIFEST_FILE="$RUNNER_TEMP/bunaken-output/snapshots/$TARGET_DATE/$SNAPSHOT_RUN_ID/manifest.json.gz"
            if [[ ! -f "$MANIFEST_FILE" ]]; then
              MANIFEST_FILE="$RUNNER_TEMP/bunaken-output/snapshots/$TARGET_DATE/$SNAPSHOT_RUN_ID/manifest.json"
            fi
            uv run --project engine --locked python -m bunaken_engine.public_release --source-data-commit "$SOURCE_DATA_COMMIT" --snapshot "$MANIFEST_FILE" --output "$RUNNER_TEMP/bunaken-web" --experimental-transfer --code-commit "$CODE_COMMIT" --publish
      - name: Verify Vercel release visibility
        if: env.OPERATION == 'collect'
        timeout-minutes: 10
        run: |
          uv run --project engine --locked python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.request import urlopen
          pointer = json.loads((Path(os.environ['RUNNER_TEMP'])/'bunaken-web/web/latest.json').read_text())
          for attempt in range(24):
              try:
                  with urlopen('https://bunaken-current-observatory.vercel.app/api/public/status', timeout=10) as response:
                      state = json.load(response)
                  if state.get('release_id') == pointer['release_id']:
                      print(json.dumps(dict(vercel_release_visible=True, release_id=pointer['release_id'])))
                      break
              except (OSError, ValueError):
                  pass
              if attempt < 23:
                  time.sleep(15)
          else:
              raise SystemExit('vercel_release_not_visible')
          PY
      - name: Match official D+1 observations
        timeout-minutes: 45
        env:
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_WRITE_TOKEN: ${{ secrets.DATA_WRITE_TOKEN }}
        run: |
          uv run --project engine --locked python -m bunaken_engine.d1_matching --code-commit "$CODE_COMMIT" --output "$RUNNER_TEMP/bunaken-d1" --publish
      - name: Save public Git blob cache
        if: always() && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GIT_DATA_CACHE_ROOT }}/blobs
          key: bunaken-public-blobs-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
