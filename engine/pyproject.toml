[project]
name = "bunaken-current-observatory-engine"
version = "0.1.0"
requires-python = "==3.14.7"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
providers = [
    "copernicusmarine==2.5.0",
    "pyfes==2026.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["bunaken_engine"]
