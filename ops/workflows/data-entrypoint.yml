# Install this exact trusted template as .github/workflows/data-entrypoint.yml on data.
# Never substitute @main or execute scripts from the data branch.
name: Data observation entrypoint
on:
  push:
    branches: [data]
    paths:
      - 'observations/**'
permissions:
  contents: read
jobs:
  environment:
    uses: taevel02/bunaken-current-observatory/.github/workflows/environment.yml@1bc89122e59058fc51956d2d2351c02162e3fbc4
    with:
      operation: collect
      code_commit: 1bc89122e59058fc51956d2d2351c02162e3fbc4
    secrets:
      GITHUB_WRITE_TOKEN: ${{ secrets.GITHUB_WRITE_TOKEN }}
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      AVISO_USERNAME: ${{ secrets.AVISO_USERNAME }}
      AVISO_PASSWORD: ${{ secrets.AVISO_PASSWORD }}
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
