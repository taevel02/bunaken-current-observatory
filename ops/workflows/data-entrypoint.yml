# Install this exact trusted template as .github/workflows/data-entrypoint.yml on data.
# Never substitute @main or execute scripts from the data branch.
name: Data observation entrypoint
on:
  push:
    branches: [data]
    paths:
      - 'observations/**'
permissions:
  contents: read
jobs:
  environment:
    uses: taevel02/bunaken-current-observatory/.github/workflows/environment.yml@c84cb9a99036be44b36a0bc73417cb119371bedc
    with:
      operation: collect
      code_commit: c84cb9a99036be44b36a0bc73417cb119371bedc
    secrets:
      DATA_WRITE_TOKEN: ${{ secrets.DATA_WRITE_TOKEN }}
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD || secrets.COPERNICUSMARINE__SERVICE_PASSWORD }}
      OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
